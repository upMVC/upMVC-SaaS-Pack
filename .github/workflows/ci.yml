name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # composer.json declares php >=8.1, but PHPUnit 11 requires php >=8.2, so dev
  # dependencies cannot install on 8.1. The runtime claim is checked separately
  # by the php81-runtime job below.
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # 8.4 reports but does not gate — see the kernel's workflow for why.
    continue-on-error: ${{ matrix.php == '8.4' }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # Deliberately resolves bitshost/upmvc from Packagist, not from a local
      # path repository. This is the run that proves the pack works the way a
      # stranger installs it — the failure mode that shipped a kernel without
      # App\Etc\Application would have been caught here.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Show resolved kernel version
        run: composer show bitshost/upmvc | head -n 5

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --display-all-issues

  # Verifies the `php >=8.1` constraint without dev dependencies, which cannot
  # install there. Also confirms the published kernel resolves on 8.1.
  php81-runtime:
    name: PHP 8.1 runtime compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install runtime dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Syntax check every source file
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Provider resolves against the published kernel
        run: |
          php -r '
            define("UPMVC_APP_ROOT", __DIR__);
            require "vendor/autoload.php";
            if (!class_exists("App\Etc\Application")) { exit(1); }
            if (!method_exists("App\Etc\Router", "registerMiddlewareFactory")) { exit(1); }
            new BitsHost\UpmvcSaas\SaasServiceProvider();
            echo "provider loads on PHP " . PHP_VERSION . PHP_EOL;
          '
